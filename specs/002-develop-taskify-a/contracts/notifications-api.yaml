openapi: 3.0.3
info:
  title: Taskify Notifications API
  description: API for managing notifications and real-time updates in Taskify
  version: 1.0.0
  contact:
    name: Taskify Team
    email: team@taskify.com

servers:
  - url: https://api.taskify.com/v1
    description: Production server
  - url: https://staging-api.taskify.com/v1
    description: Staging server

paths:
  /notifications:
    get:
      summary: Get user notifications
      description: Retrieve notifications for the current user
      operationId: getNotifications
      tags:
        - Notifications
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int32
          description: The user ID
        - name: unreadOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Filter to show only unread notifications
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 50
            maximum: 100
          description: Maximum number of notifications to return
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
          description: Number of notifications to skip
      responses:
        "200":
          description: Successfully retrieved notifications
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  totalCount:
                    type: integer
                    example: 25
                  unreadCount:
                    type: integer
                    example: 5
        "400":
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: Mark notifications as read
      description: Mark one or more notifications as read
      operationId: markNotificationsRead
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkReadRequest"
      responses:
        "200":
          description: Notifications marked as read successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  updatedCount:
                    type: integer
                    example: 3
        "400":
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications/{notificationId}:
    get:
      summary: Get notification by ID
      description: Retrieve a specific notification by its ID
      operationId: getNotification
      tags:
        - Notifications
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: The notification ID
      responses:
        "200":
          description: Successfully retrieved notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      summary: Mark notification as read
      description: Mark a specific notification as read
      operationId: markNotificationRead
      tags:
        - Notifications
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
            format: int32
          description: The notification ID
      responses:
        "200":
          description: Notification marked as read successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications/clear:
    post:
      summary: Clear all notifications
      description: Mark all notifications as read for a user
      operationId: clearAllNotifications
      tags:
        - Notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClearAllRequest"
      responses:
        "200":
          description: All notifications cleared successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  clearedCount:
                    type: integer
                    example: 15
        "400":
          description: Bad request - validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Notification:
      type: object
      required:
        - id
        - type
        - title
        - message
        - userId
        - isRead
        - createdAt
      properties:
        id:
          type: integer
          format: int32
          example: 1
        type:
          $ref: "#/components/schemas/NotificationType"
        title:
          type: string
          maxLength: 200
          example: "Task Assigned"
        message:
          type: string
          maxLength: 1000
          example: "You have been assigned to task 'Design new homepage layout'"
        userId:
          type: integer
          format: int32
          example: 2
        taskId:
          type: integer
          format: int32
          nullable: true
          example: 5
        projectId:
          type: integer
          format: int32
          nullable: true
          example: 1
        isRead:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
          example: "2024-12-19T10:00:00Z"
        readAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-12-19T15:30:00Z"

    NotificationType:
      type: string
      enum:
        - TaskAssigned
        - TaskUnassigned
        - TaskMoved
        - TaskUpdated
        - CommentAdded
        - CommentUpdated
        - CommentDeleted
        - ProjectCreated
        - ProjectUpdated
      example: "TaskAssigned"

    MarkReadRequest:
      type: object
      required:
        - notificationIds
      properties:
        notificationIds:
          type: array
          items:
            type: integer
            format: int32
          minItems: 1
          example: [1, 2, 3]

    ClearAllRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          format: int32
          example: 2

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "An error occurred"
        details:
          type: string
          nullable: true
          example: "Additional error details"

    ValidationError:
      type: object
      required:
        - message
        - errors
      properties:
        message:
          type: string
          example: "Validation failed"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: "notificationIds"
              message:
                type: string
                example: "At least one notification ID is required"
